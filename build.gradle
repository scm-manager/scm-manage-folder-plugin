plugins {
  id 'org.scm-manager.smp' version '0.17.1'
}

dependencies {
  plugin "sonia.scm.plugins:scm-editor-plugin:3.1.0"
}

scmPlugin {
  scmVersion = "3.0.0"
  displayName = "Manage Folder Plugin"
  description = "Manage folders through the web interface."

  author = "Cloudogu GmbH"
  category = "Workflow"

  openapi {
    packages = [
      "com.cloudogu.scm.emptyfolder"
    ]
  }
}
